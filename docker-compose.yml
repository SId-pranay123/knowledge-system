version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kg_user
      POSTGRES_PASSWORD: kg_pass
      POSTGRES_DB: kg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
